name: studently
description: A new Flutter project.
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  http: ^1.1.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  logger: ^2.6.2
  email_otp: ^3.0.2
  pinput: ^6.0.1
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # These are dev-only utilities (not bundled into app)
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/studently_logo.png"
  adaptive_icon_background: "#FFFFFF" # Optional: background for Android adaptive icons
  adaptive_icon_foreground: "assets/images/studently_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/