name: studently
description: A new Flutter project.
publish_to: none # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  http: ^1.1.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  logger: ^2.6.2
  email_otp: ^3.0.2
  pinput: ^6.0.1
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.0
  web_socket_channel: ^3.0.0
  syncfusion_flutter_pdfviewer: ^32.1.25
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  pdf: ^3.11.3
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  mime: ^2.0.0
  record: ^5.0.0
  audioplayers: ^5.2.1
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  flutter_riverpod: ^3.3.1
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_cropper: ^12.1.1
  google_sign_in: ^6.2.1
  syncfusion_flutter_datepicker: ^32.1.25
  js: ^0.6.7
  

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # These are dev-only utilities (not bundled into app)
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_gpt.png"
  adaptive_icon_background: "#FFFFFF" # Optional: background for Android adaptive icons
  adaptive_icon_foreground: "assets/images/Logo_gpt.png" # Optional: foreground for Android adaptive icons

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Add this at the very bottom of your pubspec.yaml
dependency_overrides:
  record_linux: ^1.3.0
  record_platform_interface: ^1.5.0

flutter_native_splash:
  color: "#FFFFFF" 
  image: "assets/images/logo_gpt.png" 
  branding: "assets/images/Studently_wordmark_cropped.png"
  branding_mode: "bottom"
  
  android_12:
    color: "#FFFFFF"
    image: "assets/images/logo_gpt.png"
    branding: "assets/images/Studently_wordmark_cropped.png"
    
  android: true
  ios: true